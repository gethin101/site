<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Survey</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #dbe3ee;
      --accent: #2563eb;
      --shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #eef4ff 0%, var(--bg) 35%, #edf2f7 100%);
      color: var(--text);
    }

    body {
      padding: 24px;
    }

    .wrap {
      max-width: 900px;
      margin: 0 auto;
    }

    .hero {
      text-align: center;
      margin: 16px 0 24px;
    }

    .hero h1 {
      margin: 0 0 8px;
      font-size: clamp(1.75rem, 3vw, 2.5rem);
      line-height: 1.15;
    }

    .hero p {
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .frame-shell {
      position: relative;
      width: 100%;
      min-height: min(85vh, 1200px);
      background: #fff;
    }

    iframe {
      display: block;
      width: 100%;
      height: min(85vh, 1200px);
      border: 0;
    }

    .note {
      padding: 14px 18px 18px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.95rem;
      background: #fafcff;
    }

    .note a {
      color: var(--accent);
      text-decoration: none;
    }

    .note a:hover {
      text-decoration: underline;
    }

    @media (max-width: 640px) {
      body { padding: 14px; }
      .hero { margin-top: 8px; }
      .frame-shell, iframe { min-height: 90vh; height: 90vh; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero" aria-label="Survey introduction">
      <h1>Quick Survey</h1>
      <p>Please take a moment to fill this out. It only takes a few minutes.</p>
    </section>

    <section class="card" aria-label="Embedded survey form">
      <div class="frame-shell">
        <iframe
          src="https://docs.google.com/forms/d/e/1FAIpQLSdmnHMydCxgxEll-d5EKKIJymxwXyu4tl5ZH0LSIGCqyh7KJA/viewform?embedded=true"
          title="Survey form"
          loading="lazy"
          allowfullscreen>
          Loading…
        </iframe>
      </div>
      <div class="note">
        If the form doesn’t load, <a href="https://docs.google.com/forms/d/e/1FAIpQLSdmnHMydCxgxEll-d5EKKIJymxwXyu4tl5ZH0LSIGCqyh7KJA/viewform" target="_blank" rel="noopener noreferrer">open it in a new tab</a>.
      </div>
    </section>
  </main>
</body>
</html>
